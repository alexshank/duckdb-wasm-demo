<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuckDB WASM Demo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
</head>

<body>
    <div style="display: flex; flex-direction: column;">
        <div style="display: flex; width: 100%;">
            <h1>DuckDB WASM Demo</h1>
        </div>

        <div style="display: flex; width: 100%; margin-bottom: 1em;">
            <p>This page shows off DuckDB running via WebAssembly (WASM) in the browser.</p>
        </div>
        <div style="display: flex; width: 100%; margin-bottom: 1em;">
            <code id="output-init" style="width: 100%; padding: 1rem;">DuckDB initialization updates go here...</code>
        </div>

        <div id="output-container" style="display: none;">
            <div id="output-01" style="display: flex; width: 100%; margin-bottom: 1em; padding: 0.5rem;">
                <div style="display: flex; flex-direction: column; width: 100%;">
                    <div style="display: flex; width: 100%;">
                        <h4>Query</h4>
                    </div>
                    <div style="display: flex; width: 100%;">
                        <code style="width: 100%; padding: 1rem;">Query goes here...</code>
                    </div>
                    <div style="display: flex; width: 100%;">
                        <h4>Results</h4>
                    </div>
                    <div style="display: flex; width: 100%;">
                        <code style="width: 100%; padding: 1rem;">Results go here...</code>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
